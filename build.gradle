buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

// Standalone builds use the published 26.3 script; integrated builds use the root script.
def sharedTools = rootProject.file('gradletools.gradle')
if (sharedTools.isFile()) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.3_fabric/gradletools.gradle'
}

group = mod_group_id
base { archivesName = 'incontrol' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    withSourcesJar()
}

// Gradle creates this task only when this mod is the root project.
tasks.matching { it.name == 'updateDaemonJvm' }.configureEach {
    languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
}

repos()
access()
runs()
jars()

sourceSets.main.resources.srcDir 'src/generated/resources'

processResources {
    def properties = [version: project.version, minecraft_version: project.minecraft_version,
                      fabric_loader_version: project.fabric_loader_version,
                      fabric_api_version: project.fabric_api_version, java_version: project.java_version]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}

dependencies {
    mc()
    implementation include("teamreborn:energy:${energy_version}")
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

modpublisher(['game-stages', 'the-lost-cities'], ['fabric-api'], ['the-lost-cities'], ['fabric-api'], [])

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}
