buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'
apply from: 'gradletools.gradle'

group = mod_group_id
base { archivesName = 'incontrol' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repos()
runs()
jars()

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    mc()
    modImplementation include('teamreborn:energy:4.1.0')
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

modpublisher(['game-stages', 'the-lost-cities'], ['fabric-api'], ['the-lost-cities'], ['fabric-api'], [])

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}
