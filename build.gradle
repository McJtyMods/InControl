plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id 'net.neoforged.gradle.userdev' version '7.0.105'
}

if (project.file('../gradletools.gradle').exists()) {
    apply from: '../gradletools.gradle'
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/1.20.5_neo/gradletools.gradle'
}

group= "com.github.mcjty"
archivesBaseName = "incontrol"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repos()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    jei()
    top()
    lostcities()
    gamestages()
    sereneseasons()
}

cfdeps(['game-stages', 'the-lost-cities'], [], [])
modrinth(['the-lost-cities'], [], [])
