buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

// Standalone builds use the published 26.3 script; integrated builds use the root script.
def sharedTools = rootProject.file('gradletools.gradle')
if (sharedTools.isFile()) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.3_neo/gradletools.gradle'
}

group = "com.github.mcjty"
base.archivesName = "incontrol"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repos()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
//    jei()
//    top()
//    gamestages()
    sereneseasons()
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

modpublisher(['game-stages', 'the-lost-cities'], [], ['the-lost-cities'], [], [])
