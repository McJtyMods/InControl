buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'
apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkSpace/26.2_fabric/gradletools.gradle'

group = mod_group_id
base { archivesName = 'incontrol' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    withSourcesJar()
}

// Gradle creates this task only on the root project (standalone builds).
if (project == rootProject) {
    tasks.named('updateDaemonJvm') {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    }
}

repos()
access()
jars()

// InControl's development runs and resource expansion are mod-specific.
loom {
    mods {
        incontrol { sourceSet sourceSets.main }
    }
    runs {
        server {
            name 'Fabric Server'
            ideConfigGenerated true
            runDir 'runs/fabric-server'
        }
        client {
            name 'Fabric Client'
            ideConfigGenerated true
            runDir 'runs/fabric-client'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(java_version)
}
processResources {
    def properties = [version: project.version, minecraft_version: project.minecraft_version,
                      fabric_loader_version: project.fabric_loader_version,
                      fabric_api_version: project.fabric_version, java_version: project.java_version]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}
jar {
    from('LICENSE') { rename { "${it}_${project.mod_id}" } }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    mc()
    implementation include("teamreborn:energy:${energy_version}")
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

modpublisher(['game-stages', 'the-lost-cities'], ['fabric-api'], ['the-lost-cities'], ['fabric-api'], [])
publisher {
    debug.set(providers.gradleProperty('publishDebug').map { it.toBoolean() }.orElse(false))
}

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
}
